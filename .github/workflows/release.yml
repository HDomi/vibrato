# Builds the standalone macOS app for every pushed version tag (vX.Y.Z) and publishes a GitHub release
# with the DMG (first install), the zip (in-app updater) and SHA256SUMS.txt (the updater checks it).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $want"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Electron's postinstall (and electron-builder) download the Electron binary from GitHub into this cache.
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install
        run: |
          # That download now and then gets a 502 from GitHub: retry before failing the release.
          for i in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci failed (attempt $i of 3)"
            [ "$i" -lt 3 ] && sleep $((i * 30))
          done
          exit 1

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build app
        run: npm run dist

      - name: Checksums
        working-directory: release
        run: |
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the annotated tag's message (same as the version commit), else generated notes.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS.txt \
            --title "Vibrato $GITHUB_REF_NAME" --verify-tag "${notes[@]}"
