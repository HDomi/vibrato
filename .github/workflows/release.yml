# Builds the standalone macOS app and the Windows remote client for every pushed version tag (vX.Y.Z) and publishes
# a GitHub release with the DMG (first install), the mac zip (in-app updater), the Windows installer and zip, and
# SHA256SUMS.txt (the updater checks it).
# Run by hand (workflow_dispatch) it only builds both apps and keeps them as workflow artifacts: no release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $want"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Electron's postinstall downloads the Electron binary from GitHub into this cache; electron-builder's own
      # tools (dmgbuild, 7zip) go to the second one. GitHub release downloads sometimes answer 504 for a while.
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install
        run: |
          # That download now and then gets a 502 from GitHub: retry before failing the release.
          for i in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci failed (attempt $i of 3)"
            [ "$i" -lt 3 ] && sleep $((i * 30))
          done
          exit 1

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build app
        # The in-app browser's native module (native/webview) must be in every release.
        # Releases are signed with the self-signed certificate (scripts/after-pack.cjs) so macOS keeps the app's
        # privacy permissions across updates; an ad-hoc release would make every user grant them again.
        env:
          VIBRATO_NATIVE_REQUIRED: '1'
          VIBRATO_SIGN_REQUIRED: '1'
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
        run: |
          # Packaging still downloads small tools from GitHub releases, which sometimes answer 504: retry.
          for i in 1 2 3; do
            npm run dist && exit 0
            echo "::warning::npm run dist failed (attempt $i of 3)"
            rm -rf release
            [ "$i" -lt 3 ] && sleep $((i * 60))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      # package.json scripts are written for a POSIX shell (cp, ||, 2>/dev/null): run them with Git Bash.
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install
        run: |
          for i in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "::warning::npm ci failed (attempt $i of 3)"
            [ "$i" -lt 3 ] && sleep $((i * 30))
          done
          exit 1

      - name: Build app
        run: |
          for i in 1 2 3; do
            npm run dist:win && exit 0
            echo "::warning::npm run dist:win failed (attempt $i of 3)"
            rm -rf release
            [ "$i" -lt 3 ] && sleep $((i * 60))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*-win-*.zip
          if-no-files-found: error

  publish:
    # A failed Windows build must not hold back the mac release (installed apps update from it).
    needs: [mac, windows]
    if: always() && github.ref_type == 'tag' && needs.mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          [ "${{ needs.windows.result }}" = success ] || echo "::warning::Windows build failed; releasing the mac app only"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the annotated tag's message (same as the version commit), else generated notes.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Vibrato $GITHUB_REF_NAME" --verify-tag "${notes[@]}"
