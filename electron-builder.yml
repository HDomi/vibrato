# Standalone macOS app: Electron shell, local server, web build and production node_modules in one bundle.
# Windows: the remote-only client (see win: below).
# Built by .github/workflows/release.yml on every pushed version tag; locally with `npm run dist` / `npm run dist:win`.
appId: com.hdomi.vibrato
productName: Vibrato
copyright: HDomi
directories:
  output: release
# Plain files instead of app.asar: the server runs as a separate Node process from these files, and
# node-pty's spawn-helper must be a real executable on disk.
asar: false
# node-pty ships N-API prebuilds that load under both Electron and system Node; nothing to recompile.
npmRebuild: false
# Package the Electron that npm ci already installed (same version, from package-lock) instead of downloading it
# and its SHASUMS256.txt from GitHub again; those downloads failed releases with 504s (2026-11-09).
electronDist: node_modules/electron/dist
files:
  - package.json
  - dist/**/*
  - "!dist/**/*.map"
  - web/dist/**/*
  - web/public/icon.png
  # The Agent SDK's bundled Claude Code binary (~250 MB). The app always runs the user's own `claude`
  # (pathToClaudeCodeExecutable), never the bundled one.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*{,/**/*}"
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  # The zip's name; server/releaseUpdate.ts looks for "-<arch>-mac.zip". The DMG overrides it below.
  artifactName: Vibrato-${version}-${arch}-mac.${ext}
  icon: assets/icon.icns
  # No Apple Developer ID: skip electron-builder's signing; scripts/after-pack.cjs signs ad hoc instead.
  identity: null
  hardenedRuntime: false
  extendInfo:
    # Approval notifications carry buttons, so default to the "alert" style that stays until dismissed.
    NSUserNotificationAlertStyle: alert
    # Prompt texts for the privacy permissions agents may need (Settings > Permissions requests them).
    NSPhotoLibraryUsageDescription: Vibrato lets agents read photos you choose to work with.
    NSDesktopFolderUsageDescription: Vibrato and its agents work on projects in your Desktop folder.
    NSDocumentsFolderUsageDescription: Vibrato and its agents work on projects in your Documents folder.
    NSDownloadsFolderUsageDescription: Vibrato and its agents read files from your Downloads folder.
    NSRemovableVolumesUsageDescription: Vibrato and its agents work on projects on removable drives.
    NSNetworkVolumesUsageDescription: Vibrato and its agents work on projects on network drives.
    NSAppleEventsUsageDescription: Agents running in Vibrato can automate other apps when you allow it.
dmg:
  artifactName: Vibrato-${version}-${arch}.${ext}
# Windows: the remote-only app (electron/main.cts REMOTE_ONLY): just the Remote tab, no local server or agents.
# Not code-signed: SmartScreen warns on first run ("More info" > "Run anyway").
win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  artifactName: Vibrato-${version}-win-${arch}.${ext}
  icon: web/public/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Vibrato-Setup-${version}-${arch}.${ext}
afterPack: scripts/after-pack.cjs
publish: null
